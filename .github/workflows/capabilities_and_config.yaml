name: Generate capabilities and config schema

on:
  push:
    branches:
      - main

jobs:
  generate_outputs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Mint baton-ci app token
        id: ci-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BATON_CI_CLIENT_ID }}
          private-key: ${{ secrets.BATON_CI_SECRET_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build -o connector ./cmd/baton-docusign

      - name: Run and save config output
        run: ./connector config > config_schema.json

      - name: Run and save capabilities output
        # ./connector capabilities calls ResourceType() with no sync-resource-types
        # filter, so clm_member's SkipEntitlements (not SkipEntitlementsAndGrants)
        # reflects the all-types-enabled default; runtime differs when
        # clm_workflow_queue is filtered out — see clmMemberBuilder.ResourceType().
        env:
          BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
          BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
          BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
          BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
          BATON_DEMO: "true"
          BATON_INCLUDE_SIGNING_GROUPS: "true"
        run: ./connector capabilities > baton_capabilities.json

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Updating baton config schema and capabilities."
          add: |
            config_schema.json
            baton_capabilities.json
