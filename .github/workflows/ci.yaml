name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
# Workflow-level (not per-job): all three jobs below hit the same shared DocuSign demo
# account, and running two runs' Grant/Revoke cycles concurrently races on that account's
# real state (one run's mid-cycle Grant/Revoke can make another run's "should be zero
# grants after Revoke" assertion fail). A per-job concurrency block only protects a
# *running* job from cancellation — GitHub Actions still cancels a *pending* job in the
# same group when a newer one queues. Declaring it once here makes the whole
# needs-chained run (all three jobs) queue/cancel as one unit against the shared group.
concurrency:
  group: docusign-demo-account
  cancel-in-progress: false
env:
  # Forces the legacy v1/SQLite c1z format instead of baton-sdk v0.25.0's new default
  # (Pebble/v3). The `baton` CLI these jobs download (ConductorOne/github-workflows'
  # get-baton action, currently v0.4.5) is built against baton-sdk v0.8.24 — long before
  # Pebble existed — and fails every read of a Pebble-format file with a bare
  # "c1z: invalid file", no matter how the file was produced. Confirmed: syncing with
  # this flag set produces a file `baton` v0.4.5 reads correctly; without it, the exact
  # same sync fails at the very next step. Safe to drop once a `baton` CLI release built
  # against a Pebble-aware baton-sdk ships and get-baton picks it up.
  BATON_STORAGE_ENGINE: sqlite
jobs:
  test-groups:
    runs-on: ubuntu-latest
    # Serializes against every other job in this file sharing this same group name
    # (across every branch/PR, not just this one) — all three hit the same shared
    # DocuSign demo account, and running two runs' Grant/Revoke cycles concurrently
    # races on that account's real state (one run's mid-cycle Grant/Revoke can make
    # another run's "should be zero grants after Revoke" assertion fail).
    concurrency:
      group: docusign-demo-account
      cancel-in-progress: false
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
      # This CI account has no CLM subscription, and (unlike a C1-hosted sync) nothing
      # here filters resource types by OptInRequired — every registered resource type is
      # attempted by default. CLM builders now fail the whole sync rather than skip
      # gracefully when CLM isn't available (see pkg/connector/clm_roles.go), so the 5
      # clm_* types must be excluded here explicitly to test the ones this job cares about.
      # This is an allowlist, not a CLM-only exclusion: if you register a new non-CLM
      # resource type in pkg/connector/connector.go, add it here too (and to the other two
      # BATON_SYNC_RESOURCE_TYPES settings below, which mirror this one) — otherwise it
      # silently gets zero CI sync-test coverage.
      BATON_SYNC_RESOURCE_TYPES: user,group,permission_profile,signing_group
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_GROUP_PRINCIPAL_TYPE }}"
  test-signing-groups:
    needs: [test-groups]
    runs-on: ubuntu-latest
    # See test-groups' identical setting above — same shared demo account.
    concurrency:
      group: docusign-demo-account
      cancel-in-progress: false
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
      # See test-groups' identical setting above: this CI account has no CLM
      # subscription, and nothing here filters by OptInRequired the way a C1-hosted sync
      # would, so the 5 clm_* types must be excluded explicitly or this job fails too.
      BATON_SYNC_RESOURCE_TYPES: user,group,permission_profile,signing_group
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke signing group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_SIGNING_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL_TYPE }}"
  test-permission-profiles:
    needs: [test-signing-groups]
    runs-on: ubuntu-latest
    # See test-groups' identical setting above — same shared demo account.
    concurrency:
      group: docusign-demo-account
      cancel-in-progress: false
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
      # See test-groups' identical setting above: this CI account has no CLM
      # subscription, and nothing here filters by OptInRequired the way a C1-hosted sync
      # would, so the 5 clm_* types must be excluded explicitly or this job fails too.
      BATON_SYNC_RESOURCE_TYPES: user,group,permission_profile,signing_group
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke permission profile test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_PERMISSION_PROFILE_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL_TYPE }}"
