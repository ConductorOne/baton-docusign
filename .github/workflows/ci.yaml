name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
# Workflow-level (not per-job): all three jobs below hit the same shared DocuSign demo
# account, and running two runs' Grant/Revoke cycles concurrently races on that account's
# real state (one run's mid-cycle Grant/Revoke can make another run's "should be zero
# grants after Revoke" assertion fail). A per-job concurrency block only protects a
# *running* job from cancellation — GitHub Actions still cancels a *pending* job in the
# same group when a newer one queues. Declaring it once here makes the whole
# needs-chained run (all three jobs) queue/cancel as one unit against the shared group.
concurrency:
  group: docusign-demo-account
  cancel-in-progress: false
jobs:
  test-groups:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_GROUP_PRINCIPAL_TYPE }}"
  test-signing-groups:
    needs: [test-groups]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke signing group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_SIGNING_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL_TYPE }}"
  test-permission-profiles:
    needs: [test-signing-groups]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke permission profile test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_PERMISSION_PROFILE_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL_TYPE }}"
