name: ci
on: pull_request
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m

  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go tests
        run: (set -o pipefail && go test -v -covermode=atomic -json -race ./... | tee test.json)
      - name: Annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  integration-test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_CLIENTID: ${{ secrets.CLIENTID }}
      BATON_CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build -o baton-docusign ./cmd/baton-docusign
      - name: Validate capabilities
        run: |
          ./baton-docusign capabilities
      - name: Run basic sync test
        run: |
          ./baton-docusign \
            --log-level debug

          if [ ! -f "sync.c1z" ]; then
            echo "Error: File sync.c1z was not generated."
            exit 1
          fi
      - name: List Baton Commands
        run: ./baton-docusign --help
