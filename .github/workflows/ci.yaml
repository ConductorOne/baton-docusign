name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
# Workflow-level, not per-job: the three demo-account jobs share the DocuSign demo
# account, and a per-job block only protects a *running* job — GitHub Actions still
# cancels a *pending* job in the same group when a newer run queues. Declaring it once
# here queues/cancels every job as one unit; test-clm-sync uses the CLM mock and only waits.
concurrency:
  group: docusign-demo-account
  cancel-in-progress: false
env:
  # This CI account has no CLM subscription, and (unlike a C1-hosted sync) nothing here
  # filters resource types by OptInRequired — every registered resource type is attempted
  # by default. Every clm_* type must stay excluded here, not just clm_workflow_queue:
  # Connector.Validate() now runs an upfront CLM-readiness check (EnsureClmReady) whenever
  # ANY clm_* type is in this allowlist, and it fails the whole sync loudly — before any
  # resource type's List() runs — rather than tolerating a no-subscription account (see
  # connector.go's Validate doc comment). Including even one clm_* type here would fail
  # these jobs' group/signing-group/permission-profile coverage too, not just skip CLM.
  # TestNonClmAllowlistMatchesCI
  # (pkg/connector/connector_test.go) pins this list against nonClmAllowlist() as a drift
  # guard.
  # This is an allowlist, not a CLM-only exclusion: if you register a new non-CLM
  # resource type in pkg/connector/connector.go, add it here too — otherwise it silently
  # gets zero CI sync-test coverage. Declared once at the workflow level (the three
  # demo-account jobs inherit it) so there's no per-job copy to keep in sync;
  # test-clm-sync overrides it on purpose to sync clm_* types against the CLM mock.
  #
  # signing_group specifically only works here because every demo-account job below sets
  # BATON_INCLUDE_SIGNING_GROUPS: "true" — the connector only advertises signing_group
  # via ListResourceTypes() when that flag is set (pkg/connector/connector.go), and the
  # SDK hard-errors on any filter entry the connector doesn't advertise
  # ("invalid resource type 'signing_group' in filter"). If a future job drops that
  # per-job env var, it fails with that confusing filter error instead of just skipping
  # signing groups.
  BATON_SYNC_RESOURCE_TYPES: user,group,permission_profile,signing_group
jobs:
  test-groups:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_GROUP_PRINCIPAL_TYPE }}"
          # DocuSign's backend doesn't apply a write instantly — the sync immediately
          # after a grant/revoke can still read the pre-write state. sync-test's sleep
          # input exists exactly for this; confirmed needed by a real failure (a
          # verification query returning no grants right after a grant that itself
          # succeeded) on test-permission-profiles, which has no built-in retry.
          sleep: "5"
  test-signing-groups:
    needs: [test-groups]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke signing group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_SIGNING_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL_TYPE }}"
          # See test-groups' identical sleep above — same shared demo account, same
          # DocuSign write-propagation delay risk.
          sleep: "5"
  test-permission-profiles:
    needs: [test-signing-groups]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_DOCUSIGN_CLIENT_ID: ${{ secrets.CLIENTID }}
      BATON_DOCUSIGN_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke permission profile test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_PERMISSION_PROFILE_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL_TYPE }}"
          # See test-groups' identical sleep above — same shared demo account, same
          # DocuSign write-propagation delay risk (the one confirmed to actually fire
          # here).
          sleep: "5"
  # Syncs the CLM types against the CLM mock (cmd/test-server); every credential is a placeholder.
  test-clm-sync:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_BASE_URL: http://localhost:8765
      BATON_CLM_BASE_URL: http://localhost:8765
      BATON_REFRESH_TOKEN: mock-token
      BATON_DOCUSIGN_CLIENT_ID: mock-client-id
      BATON_DOCUSIGN_CLIENT_SECRET: mock-client-secret
      BATON_REDIRECT_URI: http://localhost
      BATON_ACCOUNT_ID: mock-account
      BATON_SYNC_RESOURCE_TYPES: clm_member,clm_role,clm_folder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign and the CLM mock
        run: |
          go build ./cmd/baton-docusign
          go build -o clm-test-server ./cmd/test-server
      - name: Start the CLM mock
        run: |
          ./clm-test-server &
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8765 && exit 0
            sleep 1
          done
          echo "CLM mock did not start" && exit 1
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Sync CLM members, roles and folders
        run: ./baton-docusign -f sync.c1z
      - name: Check member-to-role and folder-to-role grants
        run: |
          baton grants -f sync.c1z --output-format json > grants.json
          jq -e '[.grants[] | select(.grant.entitlement.id | test("^clm_role:.+:assigned$"))] | length > 0' grants.json
          jq -e '[.grants[] | select(.grant.principal.id.resourceType == "clm_role" and (.grant.entitlement.id | startswith("clm_folder:")))] | length > 0' grants.json
          jq -e '[.grants[] | select(.grant.principal.id.resourceType == "clm_member" and (.grant.entitlement.id | startswith("clm_folder:")) and ((.grant.sources.sources // {}) | keys | any(startswith("clm_role:"))))] | length > 0' grants.json
