name: ci

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m

  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go tests
        run: (set -o pipefail && go test -v -covermode=count -json ./... | tee test.json)
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.6.0
        with:
          test-results: test.json

  test-groups:
    needs: [go-lint, go-test]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_CLIENTID: ${{ secrets.CLIENTID }}
      BATON_CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_GROUP_PRINCIPAL_TYPE }}"

  test-signing-groups:
    needs: [test-groups]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_CLIENTID: ${{ secrets.CLIENTID }}
      BATON_CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke signing group test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_SIGNING_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_SIGNING_GROUP_PRINCIPAL_TYPE }}"

  test-permission-profiles:
    needs: [test-signing-groups]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_CLIENTID: ${{ secrets.CLIENTID }}
      BATON_CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
      BATON_REDIRECT_URI: ${{ secrets.REDIRECTURI }}
      BATON_REFRESH_TOKEN: ${{ secrets.REFRESHTOKEN }}
      BATON_DEMO: "true"
      BATON_INCLUDE_SIGNING_GROUPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-docusign
        run: go build ./cmd/baton-docusign
      - name: Get baton
        uses: ConductorOne/github-workflows/actions/get-baton@v3
      - name: Grant/revoke permission profile test
        uses: ConductorOne/github-workflows/actions/sync-test@v3
        with:
          connector: ./baton-docusign
          baton-entitlement: "${{ vars.TEST_PERMISSION_PROFILE_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_PERMISSION_PROFILE_PRINCIPAL_TYPE }}"
